; ESP32-C3 wiring test for the Huawei e-ink case panel (JD79665AA, 768x552, 4 colours)
;
; 用法：
;   cd firmware/epd-wiring-test
;   pio run -t upload          ; 编译并烧写
;   pio device monitor         ; 115200，看分阶段日志
;
; 板子已在 platform-espressif32 6.13.0 上验证过；如果你升级了平台导致 Arduino 核心
; 换到 3.x 而编译报错，把 platform 改成固定版本即可。

[env:airm2m_core_esp32c3]
platform = espressif32@^6.13.0
board = airm2m_core_esp32c3
framework = arduino

monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800

; 关掉 Arduino 核心的启动日志噪声，让分阶段输出更好读
build_flags =
    -DCORE_DEBUG_LEVEL=0

build_type = release
